name: Lint Go Code
on:
  pull_request:
  push:
    branches:
      - master

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check Out Repository
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.10.1
